[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "action-locker"
version = "0.9.0"
description = "A lockfile for your GitHub Actions - and a locker for the ones you can't afford to lose"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

# No ambient runtime dependencies: the security-relevant YAML parser is a
# pinned, hashed, pure-Python closure shipped inside the Action Locker
# artifact. See third_party/ruamel.yaml and scripts/vendor_ruamel.py.
dependencies = []

[project.optional-dependencies]
# Backward-compatible no-op for prerelease installation instructions. The
# stable parser is now always included; this extra installs nothing ambient.
stable = []

[project.scripts]
action-locker = "action_locker:main"

[tool.setuptools]
py-modules = ["action_locker"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["_vendor*"]

[tool.setuptools.package-data]
"_vendor.ruamel.yaml" = [
  "py.typed",
  "LICENSE.action-locker-vendored",
  "MANIFEST.action-locker.sha256",
  "PROVENANCE.action-locker.json",
  "UPSTREAM_METADATA.action-locker",
]
