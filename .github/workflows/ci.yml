name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies
        run: |
          pip install pytest==9.1.1
      - name: Verify vendored dependency and corpus provenance
        run: |
          python3 scripts/vendor_ruamel.py --check
          python3 scripts/update_external_parser_corpus.py --check
      - name: Unit tests (offline, bundled stable parser is default)
        run: |
          python3 -m pytest -q
      - name: Parser backend agreement on repository workflows
        env:
          ACTION_LOCKER_PARSER_LAB_CI: "1"
        run: python3 action_locker.py scan --parser compare --format text
      - name: Self-verify action pins
        run: python3 action_locker.py verify
