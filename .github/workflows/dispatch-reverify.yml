# Fan-out: push re-verification to subscribed repos.
#
# When the lock/verify logic changes (action_locker.py or the reusable verify
# workflow), consumer repos should re-run their action-locker check even though
# nothing changed on their side. This workflow sends a `repository_dispatch`
# event (type: action-lock-reverify) to every repo listed in subscribers.txt.
#
# Consumer repos opt in by adding to their workflow:
#
#   on:
#     repository_dispatch:
#       types: [action-lock-reverify]
#
# The feature itself is opt-in via subscribers.txt:
#   - no active entries        -> this job is a green no-op (forks stay green)
#   - entries but no token     -> LOUD failure: you asked for fan-out and it
#                                 can't happen; silent non-dispatch is exactly
#                                 the false-confidence failure we refuse to have
#   - entries + token          -> dispatch, per-repo failures collected
#
# Cross-repo dispatch cannot use the default GITHUB_TOKEN (it is scoped to
# this repo only). It requires a token with fine-grained "Contents"
# read/write on the subscriber repos (that grants the dispatches endpoint),
# stored as the ACTION_LOCK_DISPATCH_TOKEN secret.

name: dispatch-reverify

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Single repo (owner/name) to dispatch to; empty = all of subscribers.txt"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - action_locker.py
      - .github/workflows/verify-action-locker.yml

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Send repository_dispatch to subscribers
        env:
          GH_TOKEN: ${{ secrets.ACTION_LOCK_DISPATCH_TOKEN }}
          TARGET_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail

          if [ -n "${TARGET_REPO}" ]; then
            repos="${TARGET_REPO}"
          else
            # grep exits 1 on zero matches; an empty list is a valid state
            repos=$(grep -Ev '^\s*(#|$)' subscribers.txt || true)
          fi

          if [ -z "${repos}" ]; then
            echo "::notice::subscribers.txt has no active entries — nothing to dispatch. Fan-out is opt-in: list consumer repos there to enable it."
            exit 0
          fi

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::subscribers.txt lists repos to re-verify, but the ACTION_LOCK_DISPATCH_TOKEN secret is not set — cross-repo dispatch is impossible (the default GITHUB_TOKEN is repo-scoped). Fix: add a fine-grained PAT with Contents read/write on the subscriber repos as ACTION_LOCK_DISPATCH_TOKEN, or comment out the subscribers.txt entries until you're ready. Failing loudly because 'consumers silently stopped being re-verified' is worse than a red build."
            exit 1
          fi

          failed=0
          for repo in ${repos}; do
            echo "Dispatching action-lock-reverify -> ${repo}"
            if ! gh api "repos/${repo}/dispatches" \
                -f event_type=action-lock-reverify \
                -f "client_payload[source]=steph-owl/action-locker" \
                -f "client_payload[source_sha]=${GITHUB_SHA}"; then
              echo "::error::Dispatch to ${repo} failed"
              failed=1
            fi
          done
          exit "${failed}"
